<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- SEO: 검색 키워드를 제목 앞쪽에 -->
    <title>핵심 검색어 | 서비스 이름 - 한 줄 차별점</title>
    <meta name="description" content="검색 결과에 보일 설명 (80~120자). 핵심 키워드 2~3개 자연스럽게 포함." />
    <meta name="keywords" content="키워드1, 키워드2, 키워드3" />
    <link rel="canonical" href="https://guesswhat.co.kr/SLUG/" />
    <meta name="theme-color" content="#5b5bf6" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="서비스 이름 - 한 줄 차별점" />
    <meta property="og:description" content="공유됐을 때 보일 설명" />
    <meta property="og:image" content="og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="../shared/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "서비스 이름",
        "applicationCategory": "EntertainmentApplication",
        "operatingSystem": "Any",
        "inLanguage": "ko",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
      }
    </script>
  </head>
  <body>
    <main class="app">
      <!-- 1) 첫 화면: 시스템을 한눈에 설명하는 모션그래픽 -->
      <section class="intro" id="intro" data-view="intro">
        <div class="intro__stage" aria-hidden="true"></div>
        <div class="intro__steps"></div>
        <div class="intro__caption" aria-live="polite"></div>
        <div class="intro__cta">
          <button class="btn btn--primary btn--lg btn--block" id="start">시작하기</button>
        </div>
      </section>

      <!-- 2) 본 기능 -->
      <section data-view="app" hidden></section>

      <!-- 3) 결과 -->
      <section data-view="result" hidden></section>

      <!-- 4) SEO 본문 (검색엔진이 읽는 설명/FAQ) -->
      <article class="seo">
        <h2>이 서비스는 무엇인가요?</h2>
        <p>...</p>
        <details>
          <summary>자주 묻는 질문</summary>
          <p>...</p>
        </details>
      </article>

      <nav id="more"></nav>
      <footer class="site-footer">재미로 보는 콘텐츠예요.</footer>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>

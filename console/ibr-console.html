*{box-sizing:border-box}

.tl{position:relative;height:14px;min-width:180px;background:var(--sunk);border-radius:3px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}

.asset-group{display:flex;flex-direction:column;gap:4px}

.asset{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.asset a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:13px}
.dl dt{color:var(--muted)} .dl dd{margin:0;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--ok)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.prog .bar{flex:1}
.wf{display:flex;flex-direction:column;gap:2px}

.chk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}

.box{all:unset;box-sizing:border-box;cursor:pointer;width:22px;height:22px;border:2px solid var(--line);border-radius:5px;display:grid;place-items:center;margin-top:1px;color:var(--on-ink);font-size:13px;font-weight:700}
.box:hover{border-color:var(--ok)}
.box:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.box[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}

.chk .t{font-weight:500}

<script>

function autoCheck(key,n){

  const ev=t=>objs('events').some(e=>e['브랜드']===n&&e['유형']===t);
  const all=(arr,f)=>{const ok=arr.filter(f).length;return {ok:arr.length>0&&ok===arr.length,note:ok+'/'+arr.length}};
  const filled=(...k)=>({ok:k.every(x=>String(b[x]||'').trim()),note:k.filter(x=>String(b[x]||'').trim()).length+'/'+k.length});
  switch(key){
    case 'BRAND_INFO':return filled('판매법인');
    case 'BRAND_BM':return filled('브랜드매니저');
    case 'BRANDBOOK':return filled('한줄소개','타깃고객','핵심메시지','톤앤매너');
    case 'BRAND_BAN':return filled('금지표현');

    case 'BRAND_CHANNEL':{const k=brandStores(n).length;return {ok:String(b['주력채널']||'').trim()!==''&&k>0,note:k+'개 스토어'}}

    case 'AD_LINK':{const k=objs('adlinks').filter(a=>a['브랜드']===n&&a['상태']==='집행중').length;return {ok:k>0,note:k+'개 지면'}}
    case 'EVENT_MEETING':return {ok:ev('미팅'),note:''};

    case 'COMBO':return {ok:cb.length>0,note:cb.length+'개'};
    case 'COMBO_LINES':return all(cb,c=>num(c['구성품수'])>0);
    case 'PRICE':{const pm=new Map(objs('prices').map(p=>[p['구성코드'],p]));return all(cb,c=>{const p=pm.get(c['구성코드']);return p&&num(p['소비자가격'])>0&&num(p['상시할인가'])>0})}
    case 'ASSET_LOGO':return {ok:hasA('로고','BI가이드'),note:''};
    case 'ASSET_PHOTO':return {ok:hasA('제품컷','연출컷'),note:''};
    case 'ASSET_DETAIL':return {ok:hasA('상세페이지'),note:''};
    case 'ASSET_CERT':return {ok:hasA('인증서','성분표'),note:''};

function chkGroups(n){

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function getRange(range,fresh){
  const call=()=>S.mcp.callTool(SV,'get_values',{spreadsheetId:SID,range},{cache:fresh?{refresh:true,staleTime:0}:{staleTime:15000}});
  let r;try{r=await call()}catch(e){if(e&&e.retryable){await sleep((e.retryAfterMs||600)+Math.random()*600);r=await call()}else throw e}
  let p=r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p={}}}
  return (p&&p.values)||[];
}
async function load(keys,fresh){
  const res=await Promise.allSettled(keys.map(k=>getRange(RANGES[k],fresh)));
  res.forEach((r,i)=>{const k=keys[i];if(r.status==='fulfilled'){S.raw[k]=r.value;delete S.err[k]}else S.err[k]=r.reason});
  S.syncedAt=new Date();S.loaded=true;
}
async function loadAll(fresh){
  if(!S.mcp)return;setSync('불러오는 중');
  const keys=Object.keys(RANGES);
  if(!S.loaded){await load([keys[0]],fresh);const e=S.err[keys[0]];if(e&&!e.retryable&&e.code!=='tool_error'){S.fatal=errMsg(e);render();return}}
  await load(S.loaded?keys:keys.slice(1),fresh);
  const errs=Object.values(S.err);
  S.fatal=errs.length===keys.length?errMsg(errs[0]):null;
  render();
}

async function saveRecord(key,o,row){
  const sp=SHEETS[key];const auto=new Set(sp.auto||[]);
  if(!row){if(sp.prefix&&!o[sp.cols[0]])o[sp.cols[0]]=uid(sp.prefix);if(sp.cols.includes('등록일')&&!o['등록일'])o['등록일']=ymd(new Date());row=await nextRow(sp.name)}
  const vals=sp.cols.map(c=>auto.has(c)?null:(o[c]??''));
  await writeRange(`'${sp.name}'!A${row}:${colL(sp.cols.length-1)}${row}`,[vals]);
  await load([key],true);
}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2600)}
function setSync(t){document.getElementById('sync').textContent=t}
async function guarded(fn,okMsg){
  if(S.busy)return;S.busy=true;setSync('저장 중');
  try{await fn();toast(okMsg||'저장했습니다');render()}
  catch(e){if(e&&e.code==='silent')return;toast(e&&e.code==='server_unavailable'?'응답이 없어 저장 여부를 확인하지 못했습니다. 새로고침 후 시트에서 확인하세요.':errMsg(e))}
  finally{S.busy=false;stamp()}
}
function stamp(){setSync(S.syncedAt?'동기화 '+pad(S.syncedAt.getHours())+':'+pad(S.syncedAt.getMinutes()):'시트 연결 중')}

let DLG=null;
function openForm(key,rec,title,row,onSave){
  DLG={key,row,rec:{...rec},onSave};
  document.getElementById('dtitle').textContent=title;
  const body=document.getElementById('dbody');
  body.innerHTML=FORMS[key].map(([k,t,req,cls],i)=>{
    const id='f_'+key+'_'+i;const v=rec[k]??'';const rq=req?' required':'';
    let ctl;
    if(t==='area')ctl=`<textarea id="${id}" name="${esc(k)}"${rq}>${esc(v)}</textarea>`;
    else if(t.startsWith('list:')||t.startsWith('sel:')){
      let opts;if(t==='sel:eventsId')opts=objs('events').map(e=>[e['일정ID'],e['일정명']+' · '+(e['시작일']||'')]);
      else opts=(t.startsWith('list:')?t.slice(5).split(','):OPT[t.slice(4)]()).map(x=>Array.isArray(x)?x:[x,x]);
      if(v&&!opts.some(o=>o[0]===v))opts.unshift([v,v]);
      ctl=`<select id="${id}" name="${esc(k)}"${rq}><option value=""></option>${opts.map(([a,b])=>`<option value="${esc(a)}"${a===v?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
    }else{const ty={text:'text',date:'date',url:'url',number:'number',month:'month'}[t];const val=t==='number'?String(num(v)||''):t==='date'?(pd(v)?ymd(pd(v)):''):v;
      ctl=`<input id="${id}" name="${esc(k)}" type="${ty}" value="${esc(val)}"${rq}${t==='number'?' inputmode="numeric" step="1"':''}>`}
    return `<label class="fld ${cls||''}">${esc(k)}${req?' *':''}${ctl}</label>`;
  }).join('');
  document.getElementById('dlg').showModal();
}
document.getElementById('dform').addEventListener('submit',ev=>{
  ev.preventDefault();if(!DLG)return;const {key,row,rec,onSave}=DLG;
  const fd=new FormData(ev.target);for(const [k,v] of fd.entries())rec[k]=String(v).trim();
  document.getElementById('dlg').close();
  if(onSave)onSave(rec);else guarded(()=>saveRecord(key,rec,row));
});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>document.getElementById('dlg').close()));

function vEvents(){
  const [y,mo]=S.calMonth.split('-').map(Number);const first=new Date(y,mo-1,1);const start=new Date(first);start.setDate(1-first.getDay());
  const evs=objs('events');const t0=+today();let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const on=evs.filter(e=>{const [s,en]=evRange(e);return s&&s<=d&&en>=d});
    cells+=`<div class="day ${d.getMonth()!==mo-1?'out':''} ${+d===t0?'today':''}" data-act="dayNew" data-date="${ymd(d)}"><span class="dn">${d.getDate()}</span>${on.slice(0,3).map(e=>`<button class="ev ${SALES_TYPES.has(e['유형'])?'sales':''} ${e['상태']==='완료'||e['상태']==='취소'?'done':''}" data-act="event" data-row="${e._row}" type="button" title="${esc(e['일정명'])}">${esc(e['일정명'])}</button>`).join('')}${on.length>3?`<span class="more">+${on.length-3}</span>`:''}</div>`}
  const monthEvs=evs.filter(e=>{const [s,en]=evRange(e);return s&&(ymd(s).slice(0,7)===S.calMonth||(en&&ymd(en).slice(0,7)===S.calMonth))}).sort((a,b)=>evRange(a)[0]-evRange(b)[0]);
  return `<div class="filters"><div class="cal-head"><button class="btn sm" data-act="calPrev" type="button" aria-label="이전 달">‹</button><b class="num">${y}.${pad(mo)}</b><button class="btn sm" data-act="calNext" type="button" aria-label="다음 달">›</button><button class="btn sm" data-act="calToday" type="button">이번 달</button></div><button class="btn primary" data-act="newEvent" type="button">새 일정</button><span class="legend"><span><i style="background:var(--sales)"></i>판매 행사</span><span><i style="background:var(--ops)"></i>운영 일정</span></span></div>
  <div class="cal">${['일','월','화','수','목','금','토'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
  <section class="panel"><header><h2>${mo}월 일정 목록</h2><span class="sync">${monthEvs.length}건</span></header><div class="body">${monthEvs.length?monthEvs.map(evItem).join(''):'<p class="empty">이 달에 잡힌 일정이 없습니다. 달력의 날짜를 누르면 그 날짜로 일정을 추가합니다.</p>'}</div></section>`;
}

function fixedFor(m){

  return `<div class="filters"><div class="seg" role="group" aria-label="워크플로우">${wfs.map(w=>`<button type="button" data-act="wf" data-w="${esc(w)}" aria-pressed="${w===S.wf}">${esc(w)}</button>`).join('')}</div>${S.wf?`<button class="btn primary" data-act="startWF" data-w="${esc(S.wf)}" type="button">이 워크플로우 시작</button>`:''}</div>
  ${running.length?`<div class="banner"><span>진행 중: ${running.map(g=>esc(g.brand+(g.target?' · '+g.target:''))+' '+g.done+'/'+g.items.length).join(', ')}</span></div>`:''}
  ${items.length?stages.map(st=>`<section class="panel"><header><h2>${esc(st)}</h2><span class="sync">${items.filter(i=>i['단계']===st).length}개 항목</span></header><div class="body" style="gap:0">${items.filter(i=>i['단계']===st).map(i=>`<div class="gitem"><span class="no">${esc(i['순서'])}</span><div><h4>${esc(i['항목'])}<span class="pill">${esc(i['담당역할'])}</span>${i['필수']==='N'?'<span class="pill">선택</span>':''}${i['자동확인']?'<span class="pill ok">시트 자동 확인</span>':''}</h4><p>${esc(i['기준·방법'])}</p><div class="meta">${i['산출물']?`<span>산출물 · ${esc(i['산출물'])}</span>`:''}<span class="num">시작 +${num(i['기한(일)'])}일</span></div></div></div>`).join('')}</div></section>`).join(''):'<section class="panel"><div class="body"><p class="empty">플레이북 탭이 비어 있습니다.</p></div></section>'}`;
}

function vPeople(){
  const ps=objs('people');const ot=openTasks();
  return `<div class="filters"><button class="btn primary" data-act="newPerson" type="button">담당자 추가</button></div>
  <section class="panel"><div class="tbl-wrap"><table><thead><tr><th>이름</th><th>역할</th><th>상태</th><th>이메일</th><th class="r">진행 업무</th><th class="r">마감 지남</th><th class="r">담당 브랜드</th></tr></thead><tbody>
  ${ps.length?ps.map(p=>{const mine=ot.filter(t=>t['담당자']===p['이름']);const late=mine.filter(t=>(dday(t['마감일'])??0)<0).length;const br=objs('brands').filter(b=>b['브랜드매니저']===p['이름']).length;
    return `<tr class="click" data-act="person" data-row="${p._row}" tabindex="0"><td><span class="who"><span class="av">${initials(p['이름'])}</span>${esc(p['이름'])}</span></td><td>${esc(p['역할'])}</td><td>${p['상태']?`<span class="pill ${p['상태']==='재직'?'ok':''}">${esc(p['상태'])}</span>`:''}</td><td>${esc(p['이메일'])}</td><td class="r num">${mine.length}</td><td class="r">${late?`<span class="pill bad num">${late}</span>`:'<span class="num">0</span>'}</td><td class="r num">${br}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty">아직 담당자가 없습니다. 담당자를 추가하면 업무·일정·브랜드에 배정할 수 있습니다.</td></tr>'}
  </tbody></table></div></section>`;
}

/* ---------- render ---------- */
function render(){
  const late=openTasks().filter(t=>(dday(t['마감일'])??0)<0).length;
  const lateChk=objs('checks').filter(c=>!CHK_DONE.has(c['상태'])&&(dday(c['마감일'])??0)<0).length;
  document.getElementById('nav').innerHTML=VIEWS.map(([k,l])=>`<button type="button" data-view="${k}"${S.view===k?' aria-current="page"':''}>${l}${k==='tasks'&&late?`<span class="cnt">${late}</span>`:''}${k==='brands'&&lateChk?`<span class="cnt">${lateChk}</span>`:''}</button>`).join('');
  document.getElementById('vtitle').textContent=VIEWS.find(v=>v[0]===S.view)[1];
  const me=document.getElementById('me');const ps=people();
  me.innerHTML='<option value="">선택 안 함</option>'+ps.map(p=>`<option${p===S.me?' selected':''}>${esc(p)}</option>`).join('');
  const ban=document.getElementById('banner');const view=document.getElementById('view');
  const partial=Object.keys(S.err).filter(k=>!S.fatal);
  if(S.fatal){ban.innerHTML=`<div class="banner bad"><span>${esc(S.fatal)}</span><button class="btn sm" data-act="reload" type="button">다시 시도</button></div>`}
  else if(partial.length){ban.innerHTML=`<div class="banner"><span>${partial.map(k=>RANGES[k].split('!')[0]).join(', ')} 탭을 불러오지 못했습니다. ${esc(errMsg(S.err[partial[0]]))}</span><button class="btn sm" data-act="reload" type="button">다시 시도</button></div>`}
  else ban.innerHTML='';
  if(!S.loaded&&!S.fatal){view.innerHTML=`<div class="kpis">${['이번 달 매출','매출이익','광고비','미입금 정산','마감 지난 업무'].map(k=>kpi(k,'—','시트에서 불러오는 중')).join('')}</div><section class="panel"><div class="body"><p class="empty">상품 마스터 시트의 업무·일정·정산·주문 탭을 읽고 있습니다. 처음 열면 Google Sheets 사용 허용을 묻습니다.</p></div></section>`;stamp();return}
  view.innerHTML=({home:vHome,guide:vGuide,tasks:vTasks,events:vEvents,settle:vSettle,close:vClose,brands:vBrands,people:vPeople})[S.view]();
  stamp();
}

/* ---------- events ---------- */
document.getElementById('sheetLink').href='https://docs.google.com/spreadsheets/d/'+SID+'/edit';
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;S.view=b.dataset.view;ls.set('view',S.view);if(S.view!=='brands')S.brandSel=null;render()});
document.getElementById('me').addEventListener('change',e=>{S.me=e.target.value;ls.set('me',S.me);render()});
document.getElementById('refresh').addEventListener('click',()=>loadAll(true));
const findRow=(key,row)=>objs(key).find(o=>o._row===+row);
function saveChopt(rec){const row=DLG&&DLG.row;if(!rec['거래방식']){const st=objs('stores').find(x=>x['스토어']===rec['스토어']);if(st)rec['거래방식']=st['거래방식']}guarded(()=>saveRecord('chopts',rec,row),'판매 옵션을 저장했습니다')}
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fBrand'){S.f.brand=t.value;render()}
  if(t.id==='fPerson'){S.f.person=t.value;render()}
  if(t.id==='fMonth'&&t.value){S.month=t.value;render()}
});
document.addEventListener('input',e=>{if(e.target.id==='fQ'){S.f.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('fQ');if(q){q.focus();q.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-act]'))e.target.click()});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.closest('dialog'))return;
  if(el.classList.contains('day')&&e.target.closest('.ev'))return;
  const a=el.dataset.act,row=el.dataset.row;
  switch(a){
    case 'reload':S.fatal=null;loadAll(true);break;
    case 'task':{const t=findRow('tasks',row);if(t)openForm('tasks',t,'업무 수정',t._row);break}
    case 'newTask':openForm('tasks',{상태:'대기',우선순위:'보통',요청자:S.me,담당자:S.me,브랜드:el.dataset.b||S.f.brand||'',시작일:ymd(new Date())},'새 업무');break;
    case 'event':{const v=findRow('events',row);if(v)openForm('events',v,'일정 수정',v._row);break}
    case 'newEvent':openForm('events',{상태:'예정',담당자:S.me,브랜드:el.dataset.b||'',시작일:ymd(new Date())},'새 일정');break;
    case 'dayNew':openForm('events',{상태:'예정',담당자:S.me,시작일:el.dataset.date},'새 일정');break;
    case 'calPrev':S.calMonth=monthAdd(S.calMonth,-1);render();break;
    case 'calNext':S.calMonth=monthAdd(S.calMonth,1);render();break;
    case 'calToday':S.calMonth=thisMonth();render();break;
    case 'grp':S.grp=el.dataset.g;render();break;
    case 'brand':S.brandSel=el.dataset.b;S.btab=S.btab||'over';S.view='brands';ls.set('view','brands');render();break;
    case 'brandBack':S.brandSel=null;render();break;
    case 'btab':S.btab=el.dataset.t;ls.set('btab',S.btab);render();break;
    case 'chopt':{const o=findRow('chopts',row);if(o)openForm('chopts',o,'판매 옵션 수정',o._row,saveChopt);break}
    case 'newChopt':openForm('chopts',{상태:'판매중',판매형태:'일반',스토어:el.dataset.s||''},S.brandSel+' 판매 옵션 추가',null,saveChopt);break;
    case 'bchan':{const x=findRow('bchan',row);if(x)openForm('bchan',x,x['스토어']+' 연결 수정',x._row);break}
    case 'newBchan':openForm('bchan',{브랜드:S.brandSel,상태:'운영중',시작일:ymd(new Date())},S.brandSel+' 스토어 연결');break;
    case 'adlink':{const x=findRow('adlinks',row);if(x)openForm('adlinks',x,x['광고지면']+' 광고 수정',x._row);break}
    case 'newAdlink':openForm('adlinks',{브랜드:S.brandSel,상태:'집행중',시작일:ymd(new Date())},S.brandSel+' 광고 추가');break;
    case 'brandEdit':{const b=findRow('brands',row);if(b)openForm('brands',b,b['브랜드']+' 브랜드북',b._row);break}
    case 'newAsset':openForm('assets',{브랜드:el.dataset.b||'',상태:'사용중',담당자:S.me},'에셋 등록');break;
    case 'asset':{const x=findRow('assets',row);if(x)openForm('assets',x,'에셋 수정',x._row);break}
    case 'newBrand':openForm('newBrand',{상태:'런칭예정','온보딩 시작일':ymd(new Date())},'새 브랜드 시작',null,newBrand);break;
    case 'startWF':openForm('startwf',{브랜드:el.dataset.b||S.brandSel||'',워크플로우:el.dataset.w||'브랜드 온보딩',시작일:ymd(new Date())},'워크플로우 시작',null,startWF);break;
    case 'wf':S.wf=el.dataset.w;render();break;
    case 'chkEdit':{const c=findRow('checks',row);if(c)openForm('checks',c,c['항목'],c._row);break}
    case 'chkToggle':{const c=findRow('checks',row);if(!c)break;const done=CHK_DONE.has(c['상태']);
      guarded(async()=>{await writeRange(`'체크리스트'!J${row}:K${row}`,[done?['미착수','']:['완료',ymd(new Date())]]);await load(['checks'],true)},done?'완료 표시를 해제했습니다':'완료했습니다');break}
    case 'newFixed':openForm('fixed',{월:S.month,항목:'인건비'},'고정비 추가');break;
    case 'fixed':{const f=findRow('fixed',row);if(f)openForm('fixed',f,(f['월']===S.month?'':f['월']+' ')+'고정비 수정',f._row);break}
    case 'copyFixed':{const fx=fixedFor(S.month);if(!fx.carried)break;const rows=fx.rows.map(r=>[S.month,r['항목'],r['판매법인'],r['브랜드'],num(r['금액']),r['메모']]);
      guarded(async()=>{const r0=await nextRow('고정비');await writeRange(`'고정비'!A${r0}:F${r0+rows.length-1}`,rows);await load(['fixed'],true)},fx.from+' 고정비 '+rows.length+'건을 '+S.month+'로 복사했습니다');break}
    case 'newPerson':openForm('people',{상태:'재직'},'담당자 추가');break;
    case 'person':{const p=findRow('people',row);if(p)openForm('people',p,'담당자 수정',p._row);break}
    case 'savePay':{const pay=document.getElementById('pay_'+row).value.trim();const d=document.getElementById('pd_'+row).value;
      guarded(async()=>{await writeRange(`'정산'!H${row}:I${row}`,[[pay===''?'':num(pay),d]]);await load(['settle'],true)},'입금 내역을 저장했습니다');break}
    case 'addSettle':{const m=S.month;const have=new Set(objs('settle').filter(s=>s['월']===m).map(s=>s['채널']));
      const add=[...new Set(salesOf(m).filter(r=>num(r['매출'])>0).map(r=>r['채널']))].filter(c=>!have.has(c));if(!add.length)break;
      guarded(async()=>{const r0=await nextRow('정산');await writeRange(`'정산'!A${r0}:B${r0+add.length-1}`,add.map(c=>[m,c]));await load(['settle'],true)},add.length+'개 채널 정산 행을 추가했습니다');break}
  }
});
setInterval(()=>{if(document.visibilityState==='visible'&&!document.getElementById('dlg').open&&!S.busy&&S.mcp&&!S.fatal)loadAll(false)},90000);

(async function boot(){
  render();
  const use=window.claude&&window.claude.use;
  S.mcp=use?await window.claude.use('mcp').catch(()=>null):null;
  if(!S.mcp){S.fatal='이 화면에서는 시트 연결을 쓸 수 없습니다. claude.ai에 로그인한 상태에서 이 페이지를 열어 주세요.';render();return}
  await loadAll(false);
})();
</script>

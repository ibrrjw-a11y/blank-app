<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: operations console — fixed nav rail + working pane; numbers in mono, state carried by pills and stripes */
:root{

  --fg:#16203A; --muted:#5A6580; --ink:#1F3864; --ink-soft:#E3E9F4; --on-ink:#FFFFFF;
  --ok:#2C7A57; --ok-bg:#E2F2EA; --warn:#A8670F; --warn-bg:#FBEFD9; --bad:#B8362F; --bad-bg:#F9E2E0;

  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1524; --surface:#172036; --sunk:#111A2C; --line:#2A3654;
  --fg:#E6EAF3; --muted:#9AA5BE; --ink:#8FB0E8; --ink-soft:#1E2B48; --on-ink:#0F1524;
  --ok:#6FCB9C; --ok-bg:#16352A; --warn:#E7B159; --warn-bg:#3A2C12; --bad:#F08A82; --bad-bg:#3D1C1B;
  --sales:#9DB7EE; --sales-bg:#1F2D4D; --ops:#AEB3C2; --ops-bg:#232B3E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1524; --surface:#172036; --sunk:#111A2C; --line:#2A3654;
  --fg:#E6EAF3; --muted:#9AA5BE; --ink:#8FB0E8; --ink-soft:#1E2B48; --on-ink:#0F1524;
  --ok:#6FCB9C; --ok-bg:#16352A; --warn:#E7B159; --warn-bg:#3A2C12; --bad:#F08A82; --bad-bg:#3D1C1B;
  --sales:#9DB7EE; --sales-bg:#1F2D4D; --ops:#AEB3C2; --ops-bg:#232B3E; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand-mark{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand-mark b{font-size:16px;letter-spacing:-.01em}
.brand-mark span{font-size:11px;color:var(--muted);letter-spacing:.04em}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:6px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
nav button:hover{background:var(--sunk);color:var(--fg)}
nav button[aria-current="page"]{background:var(--ink-soft);color:var(--ink);font-weight:600}
nav button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
nav .cnt{font-family:var(--f-num);font-size:11px;background:var(--bad-bg);color:var(--bad);padding:0 6px;border-radius:9px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 8px;font-size:12px;color:var(--muted)}
.main{min-width:0;padding-block:20px 48px;padding-inline:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.topbar h1{font-size:22px;margin:0;letter-spacing:-.02em;text-wrap:balance}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.btn[disabled]{opacity:.5;cursor:default}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.fld>*{color:var(--fg);font-size:14px;font-weight:400}
.sync{font-size:12px;color:var(--muted)}
.banner{border:1px solid var(--warn);background:var(--warn-bg);color:var(--fg);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.bad{border-color:var(--bad);background:var(--bad-bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--f-num);font-size:22px;font-weight:500;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--bad)} .kpi.alert .v{color:var(--bad)}
.kpi.caution .v{color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>header h2{font-size:14px;margin:0}
.panel .body{padding:12px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:12px;color:var(--muted)}
.date-tag{font-family:var(--f-num);font-size:12px;color:var(--muted);min-width:44px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.sales{background:var(--sales-bg);color:var(--sales)} .pill.ops{background:var(--ops-bg);color:var(--ops)}
.pill.num{font-family:var(--f-num);font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col>h3{margin:0;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;padding:0 2px;letter-spacing:.03em}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--ink)}
.card.p-긴급{border-left-color:var(--bad)} .card.p-높음{border-left-color:var(--warn)} .card.p-보통{border-left-color:var(--sales)}
.card .t{font-weight:600;line-height:1.35}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:4px}
.av{width:20px;height:20px;border-radius:50%;background:var(--ink-soft);color:var(--ink);font-size:10px;font-weight:700;display:inline-grid;place-items:center}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;border-top:2px solid var(--line)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td input{width:120px;padding:4px 6px}
.neg{color:var(--bad)}
.cal-head{display:flex;gap:8px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{font-size:11px;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk);font-weight:600}
.cal .day{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;background:var(--surface)}
.cal .day.out{background:var(--sunk);opacity:.6}
.cal .day .dn{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.cal .day.today .dn{color:var(--on-ink);background:var(--ink);border-radius:9px;padding:0 6px;align-self:flex-start}
.ev{all:unset;cursor:pointer;font-size:11px;padding:1px 5px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--ops-bg);color:var(--ops)}
.ev.sales{background:var(--sales-bg);color:var(--sales)}
.ev.done{text-decoration:line-through;opacity:.6}
.more{font-size:11px;color:var(--muted)}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.bcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.bcard:hover{border-color:var(--ink)} .bcard:focus-visible{outline:2px solid var(--ink)}
.bcard b{font-size:15px}
.bcard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11px;color:var(--muted)}
.bcard .stats span b{display:block;font-family:var(--f-num);font-size:15px;color:var(--fg);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg button:focus-visible{outline:2px solid var(--ink)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--fg);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,16,30,.45)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
dialog header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
dialog header h2{margin:0;font-size:16px}
.dbody{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow:auto}
.dbody .wide{grid-column:1/-1}
.dfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
textarea{min-height:80px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100vw - 32px)}
.asset-group{display:flex;flex-direction:column;gap:4px}
.asset-group h4{margin:6px 0 2px;font-size:12px;color:var(--muted)}
.asset{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.asset a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:13px}
.dl dt{color:var(--muted)} .dl dd{margin:0;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--ok)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.prog .bar{flex:1}
.wf{display:flex;flex-direction:column;gap:2px}
.stage{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;padding:10px 0 4px;border-bottom:1px solid var(--line)}
.chk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:0}
.box{all:unset;box-sizing:border-box;cursor:pointer;width:22px;height:22px;border:2px solid var(--line);border-radius:5px;display:grid;place-items:center;margin-top:1px;color:var(--on-ink);font-size:13px;font-weight:700}
.box:hover{border-color:var(--ok)}
.box:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.box[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.box.na{background:var(--sunk);border-color:var(--line);color:var(--muted)}
.chk .t{font-weight:500}
.chk.done .t{color:var(--muted);text-decoration:line-through}
.chk .no{font-family:var(--f-num);font-size:12px;color:var(--muted);margin-right:6px}
.chk .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:3px}
.chk details{margin-top:4px;font-size:13px;color:var(--muted)}
.chk details summary{cursor:pointer;font-size:12px;width:max-content}
.chk details p{margin:4px 0 0;max-width:65ch}
.book{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.book .f{display:flex;flex-direction:column;gap:3px}
.book .f span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.book .f p{margin:0;white-space:pre-wrap;max-width:65ch}
.book .f p.miss{color:var(--warn)}
.lede{font-size:17px;font-weight:600;line-height:1.45;margin:0;text-wrap:balance}
.gitem{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.gitem:last-child{border-bottom:0}
.gitem .no{font-family:var(--f-num);color:var(--muted);font-size:13px;padding-top:1px}
.gitem h4{margin:0 0 4px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gitem p{margin:0 0 6px;max-width:65ch}
.gitem .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:8px 12px;gap:12px;z-index:5;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand-mark span,.rail-foot{display:none}
  nav{flex-direction:row}
  nav button{padding:7px 10px;white-space:nowrap}
  .dbody{grid-template-columns:1fr}
  .cal .day{min-height:64px}
  .cal .ev{font-size:10px}
}
@media (prefers-reduced-motion:no-preference){.card,.bcard,.btn{transition:border-color .15s}}
</style>

<div class="app">

</div>

  const all=(arr,f)=>{const ok=arr.filter(f).length;return {ok:arr.length>0&&ok===arr.length,note:ok+'/'+arr.length}};
  const filled=(...k)=>({ok:k.every(x=>String(b[x]||'').trim()),note:k.filter(x=>String(b[x]||'').trim()).length+'/'+k.length});
  switch(key){
    case 'BRAND_INFO':return filled('판매법인');

    case 'SKU':return {ok:sk.length>0,note:sk.length+'개'};
    case 'SKU_COST':return all(sk,s=>num(s['원가(VAT포함)'])>0);
    case 'COMBO':return {ok:cb.length>0,note:cb.length+'개'};
    case 'COMBO_LINES':return all(cb,c=>num(c['구성품수'])>0);
    case 'PRICE':{const pm=new Map(objs('prices').map(p=>[p['구성코드'],p]));return all(cb,c=>{const p=pm.get(c['구성코드']);return p&&num(p['소비자가격'])>0&&num(p['상시할인가'])>0})}
    case 'ASSET_LOGO':return {ok:hasA('로고','BI가이드'),note:''};

async function getRange(range,fresh){
  const call=()=>S.mcp.callTool(SV,'get_values',{spreadsheetId:SID,range},{cache:fresh?{refresh:true,staleTime:0}:{staleTime:15000}});
  let r;try{r=await call()}catch(e){if(e&&e.retryable){await sleep((e.retryAfterMs||600)+Math.random()*600);r=await call()}else throw e}
  let p=r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p={}}}
  return (p&&p.values)||[];
}

      ctl=`<input id="${id}" name="${esc(k)}" type="${ty}" value="${esc(val)}"${rq}${t==='number'?' inputmode="numeric" step="1"':''}>`}
    return `<label class="fld ${cls||''}">${esc(k)}${req?' *':''}${ctl}</label>`;
  }).join('');
  document.getElementById('dlg').showModal();
}
document.getElementById('dform').addEventListener('submit',ev=>{

function closeData(m,grp){
  const key={브랜드:'브랜드',판매법인:'판매법인',판매채널:'판매채널'}[grp];
  const g={};const add=(k)=>g[k]=g[k]||{k,rev:0,cost:0,settle:0,exp:0,n:0};
  objs('orders').filter(o=>o['월']===m).forEach(o=>{const k=o[key]||'미매칭';const r=add(k);r.rev+=num(o['결제금액']);r.cost+=num(o['원가']);r.settle+=num(o['정산금액']);r.n++});
  if(grp!=='판매채널')objs('costs').filter(c=>c['월']===m).forEach(c=>{const k=c[key]||'공통';add(k).exp+=num(c['금액'])});
  return Object.values(g).map(r=>({...r,fee:r.rev-r.settle,profit:r.settle-r.cost-r.exp})).sort((a,b)=>b.rev-a.rev);
}
function trendSvg(){
  const ms=[];for(let i=5;i>=0;i--)ms.push(monthAdd(S.month,-i));
  const d=ms.map(m=>{const r=closeData(m,'브랜드');return {m,rev:r.reduce((a,x)=>a+x.rev,0),p:r.reduce((a,x)=>a+x.profit,0)}});
  if(d.every(x=>!x.rev&&!x.p))return '<p class="empty">최근 6개월 주문 데이터가 없습니다.</p>';
  const max=Math.max(1,...d.map(x=>Math.max(x.rev,x.p)));const minP=Math.min(0,...d.map(x=>x.p));
  const W=600,H=200,L=56,B=26,T=12,cw=(W-L-8)/6;const span=max-minP;const y=v=>T+(H-T-B)*(1-(v-minP)/span);
  const ticks=[minP,(max+minP)/2,max].map(v=>Math.round(v/1e4)*1e4);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 6개월 매출과 공헌이익">
  ${ticks.map(v=>`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v>=1e8?(v/1e8).toFixed(1)+'억':Math.round(v/1e4).toLocaleString('ko-KR')+'만'}</text>`).join('')}
  <line x1="${L}" x2="${W-8}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>
  ${d.map((x,i)=>{const cx=L+cw*i+cw/2;const bw=cw*.3;const cur=x.m===S.month;return `<rect x="${cx-bw-1}" y="${Math.min(y(x.rev),y(0))}" width="${bw}" height="${Math.abs(y(0)-y(x.rev))}" fill="var(--ink)" opacity="${cur?1:.55}"/><rect x="${cx+1}" y="${Math.min(y(x.p),y(0))}" width="${bw}" height="${Math.abs(y(0)-y(x.p))}" fill="${x.p<0?'var(--bad)':'var(--ok)'}" opacity="${cur?1:.55}"/><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${cur?'var(--fg)':'var(--muted)'}" font-family="IBM Plex Mono,monospace">${x.m.slice(2).replace('-','.')}</text>`}).join('')}
  </svg>`;
}

/* ---------- render ---------- */
function render(){
  const late=openTasks().filter(t=>(dday(t['마감일'])??0)<0).length;
  const lateChk=objs('checks').filter(c=>!CHK_DONE.has(c['상태'])&&(dday(c['마감일'])??0)<0).length;
  document.getElementById('nav').innerHTML=VIEWS.map(([k,l])=>`<button type="button" data-view="${k}"${S.view===k?' aria-current="page"':''}>${l}${k==='tasks'&&late?`<span class="cnt">${late}</span>`:''}${k==='brands'&&lateChk?`<span class="cnt">${lateChk}</span>`:''}</button>`).join('');
  document.getElementById('vtitle').textContent=VIEWS.find(v=>v[0]===S.view)[1];
  const me=document.getElementById('me');const ps=people();
  me.innerHTML='<option value="">선택 안 함</option>'+ps.map(p=>`<option${p===S.me?' selected':''}>${esc(p)}</option>`).join('');
  const ban=document.getElementById('banner');const view=document.getElementById('view');
  const partial=Object.keys(S.err).filter(k=>!S.fatal);
  if(S.fatal){ban.innerHTML=`<div class="banner bad"><span>${esc(S.fatal)}</span><button class="btn sm" data-act="reload" type="button">다시 시도</button></div>`}
  else if(partial.length){ban.innerHTML=`<div class="banner"><span>${partial.map(k=>RANGES[k].split('!')[0]).join(', ')} 탭을 불러오지 못했습니다. ${esc(errMsg(S.err[partial[0]]))}</span><button class="btn sm" data-act="reload" type="button">다시 시도</button></div>`}
  else ban.innerHTML='';
  if(!S.loaded&&!S.fatal){view.innerHTML=`<div class="kpis">${['이번 달 매출','정산 예정액','미입금 정산','마감 지난 업무','미매칭 주문'].map(k=>kpi(k,'—','시트에서 불러오는 중')).join('')}</div><section class="panel"><div class="body"><p class="empty">상품 마스터 시트의 업무·일정·정산·주문 탭을 읽고 있습니다. 처음 열면 Google Sheets 사용 허용을 묻습니다.</p></div></section>`;stamp();return}
  view.innerHTML=({home:vHome,guide:vGuide,tasks:vTasks,events:vEvents,settle:vSettle,close:vClose,brands:vBrands,people:vPeople})[S.view]();
  stamp();
}

/* ---------- events ---------- */
document.getElementById('sheetLink').href='https://docs.google.com/spreadsheets/d/'+SID+'/edit';
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;S.view=b.dataset.view;ls.set('view',S.view);if(S.view!=='brands')S.brandSel=null;render()});
document.getElementById('me').addEventListener('change',e=>{S.me=e.target.value;ls.set('me',S.me);render()});
document.getElementById('refresh').addEventListener('click',()=>loadAll(true));
const findRow=(key,row)=>objs(key).find(o=>o._row===+row);
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fBrand'){S.f.brand=t.value;render()}
  if(t.id==='fPerson'){S.f.person=t.value;render()}
  if(t.id==='fMonth'&&t.value){S.month=t.value;render()}
});
document.addEventListener('input',e=>{if(e.target.id==='fQ'){S.f.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('fQ');if(q){q.focus();q.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-act]'))e.target.click()});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.closest('dialog'))return;
  if(el.classList.contains('day')&&e.target.closest('.ev'))return;
  const a=el.dataset.act,row=el.dataset.row;
  switch(a){
    case 'reload':S.fatal=null;loadAll(true);break;
    case 'task':{const t=findRow('tasks',row);if(t)openForm('tasks',t,'업무 수정',t._row);break}
    case 'newTask':openForm('tasks',{상태:'대기',우선순위:'보통',요청자:S.me,담당자:S.me,브랜드:el.dataset.b||S.f.brand||'',시작일:ymd(new Date())},'새 업무');break;
    case 'event':{const v=findRow('events',row);if(v)openForm('events',v,'일정 수정',v._row);break}
    case 'newEvent':openForm('events',{상태:'예정',담당자:S.me,브랜드:el.dataset.b||'',시작일:ymd(new Date())},'새 일정');break;
    case 'dayNew':openForm('events',{상태:'예정',담당자:S.me,시작일:el.dataset.date},'새 일정');break;
    case 'calPrev':S.calMonth=monthAdd(S.calMonth,-1);render();break;
    case 'calNext':S.calMonth=monthAdd(S.calMonth,1);render();break;
    case 'calToday':S.calMonth=thisMonth();render();break;
    case 'grp':S.grp=el.dataset.g;render();break;
    case 'newCost':openForm('costs',{월:S.month},'비용 입력');break;
    case 'cost':{const c=findRow('costs',row);if(c)openForm('costs',c,'비용 수정',c._row);break}
    case 'brand':S.brandSel=el.dataset.b;S.view='brands';ls.set('view','brands');render();break;
    case 'brandBack':S.brandSel=null;render();break;
    case 'brandEdit':{const b=findRow('brands',row);if(b)openForm('brands',b,b['브랜드']+' 브랜드북',b._row);break}
    case 'newAsset':openForm('assets',{브랜드:el.dataset.b||'',상태:'사용중',담당자:S.me},'에셋 등록');break;
    case 'asset':{const x=findRow('assets',row);if(x)openForm('assets',x,'에셋 수정',x._row);break}
    case 'newBrand':openForm('newBrand',{상태:'런칭예정','온보딩 시작일':ymd(new Date())},'새 브랜드 시작',null,newBrand);break;
    case 'startWF':openForm('startwf',{브랜드:el.dataset.b||S.brandSel||'',워크플로우:el.dataset.w||'브랜드 온보딩',시작일:ymd(new Date())},'워크플로우 시작',null,startWF);break;
    case 'wf':S.wf=el.dataset.w;render();break;
    case 'chkEdit':{const c=findRow('checks',row);if(c)openForm('checks',c,c['항목'],c._row);break}
    case 'chkToggle':{const c=findRow('checks',row);if(!c)break;const done=CHK_DONE.has(c['상태']);
      guarded(async()=>{await writeRange(`'체크리스트'!J${row}:K${row}`,[done?['미착수','']:['완료',ymd(new Date())]]);await load(['checks'],true)},done?'완료 표시를 해제했습니다':'완료했습니다');break}
    case 'newPerson':openForm('people',{상태:'재직'},'담당자 추가');break;
    case 'person':{const p=findRow('people',row);if(p)openForm('people',p,'담당자 수정',p._row);break}
    case 'savePay':{const pay=document.getElementById('pay_'+row).value.trim();const d=document.getElementById('pd_'+row).value;
      guarded(async()=>{await writeRange(`'정산'!H${row}:I${row}`,[[pay===''?'':num(pay),d]]);await load(['settle'],true)},'입금 내역을 저장했습니다');break}
    case 'addSettle':{const m=S.month;const have=new Set(objs('settle').filter(s=>s['월']===m).map(s=>s['스토어']));
      const add=[...new Set(objs('orders').filter(o=>o['월']===m&&o['스토어']).map(o=>o['스토어']))].filter(s=>!have.has(s));
      guarded(async()=>{const r0=await nextRow('정산');await writeRange(`'정산'!A${r0}:B${r0+add.length-1}`,add.map(s=>[m,s]));await load(['settle'],true)},add.length+'개 스토어 정산 행을 추가했습니다');break}
  }
});
setInterval(()=>{if(document.visibilityState==='visible'&&!document.getElementById('dlg').open&&!S.busy&&S.mcp&&!S.fatal)loadAll(false)},90000);

(async function boot(){
  render();
  const use=window.claude&&window.claude.use;
  S.mcp=use?await window.claude.use('mcp').catch(()=>null):null;
  if(!S.mcp){S.fatal='이 화면에서는 시트 연결을 쓸 수 없습니다. claude.ai에 로그인한 상태에서 이 페이지를 열어 주세요.';render();return}
  await loadAll(false);
})();
</script>

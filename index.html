<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>목록</title>
</head>
<body>
<!-- 도메인 루트. 브랜드·디자인 없는 링크 목록일 뿐이고 검색 노출하지 않는다. 각 도구가 독립된 입구다. -->
<ul id="list"></ul>
<script type="module">
import { TOOLS } from "./shared/sites.js";
document.getElementById("list").innerHTML = TOOLS.map((t) => `<li><a href="${t.path}/">${t.name}</a></li>`).join("");
</script>
</body>
</html>

<!--
    향 카드 (메인 '세 가지 향', 브랜드 이야기, 상품 상세 '세 가지 향 비교' 공통)
    product_listmain_1 (메인진열 1번 그룹) 안에서 씁니다. 같은 칸을 두 번 적는 것은 카페24 규칙입니다.
    목록 이미지는 배경을 지운 PNG(제품 컷)일 때 가장 잘 어울립니다. /arvo/img/upload/ 에 준비해 두었습니다.
-->
<li class="scent-card" data-arvo-card data-reveal>
    <a class="panel" href="{$link_product_detail}">
        <svg class="grain" viewBox="0 0 100 130" preserveAspectRatio="none" aria-hidden="true"><path d="M-10 10 C 22 2, 44 34, 112 22"/><path d="M-10 32 C 26 22, 46 58, 112 46"/><path d="M-10 56 C 30 46, 50 82, 112 70"/><path d="M-10 80 C 24 72, 56 106, 112 94"/><path d="M-10 104 C 30 96, 50 130, 112 118"/><path d="M18 -6 C 28 40, 70 62, 92 140"/></svg>
        <span class="no num" data-arvo-no></span>
        <img src="{$image_medium}" id="{$image_medium_id}" alt="{$seo_alt_tag}" loading="lazy">
    </a>
    <div class="txt">
        <span class="en-name" data-arvo-en></span>
        <h3><a href="{$link_product_detail}" data-arvo-name>{$product_name}</a></h3>
        <p class="line" data-arvo-line>{$summary_desc}</p>
        <p class="notes" data-arvo-notes></p>
        <div class="meta">
            <span class="prices"><span class="price {$product_price_display|display} {$product_sale_strike}">{$disp_product_price}</span> <span class="price sale {$product_sale_display|display}">{$product_sale_price}</span></span>
            <a class="link-arrow" href="{$link_product_detail}">자세히 보기 <svg width="14" height="10" viewBox="0 0 14 10" aria-hidden="true"><path d="M0 5h12M8 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></a>
        </div>
    </div>
</li>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>IBR 관리자</title>
<meta name="theme-color" content="#07110F">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/admin/admin.css">
</head>
<body>
<!--
  IBR 홈페이지 관리자 화면.
  제품·브랜드·IR 글을 고치고 '저장'을 누르면 바뀐 파일을 GitHub 저장소에 한 번에 커밋합니다.
  사이트(호스팅)가 저장소에 연결되어 있으면 잠시 뒤 홈페이지에 반영됩니다.
  연결 정보(토큰)는 이 브라우저에만 저장됩니다. 메뉴에는 링크하지 않습니다.
-->
<header class="top">
  <a class="brand" href="index.html" title="홈페이지 열기"><b>IBR</b> 관리자</a>
  <nav class="tabs" role="tablist" aria-label="관리 메뉴">
    <button type="button" role="tab" data-tab="products" aria-selected="true">제품</button>
    <button type="button" role="tab" data-tab="brands" aria-selected="false">브랜드</button>
    <button type="button" role="tab" data-tab="ir" aria-selected="false">IR · 소식</button>
    <button type="button" role="tab" data-tab="settings" aria-selected="false">연결 · 설정</button>
  </nav>
  <div class="acts">
    <span class="conn" id="conn" title="저장소 연결 상태">연결 안 됨</span>
    <button type="button" class="btn primary" id="saveBtn" disabled>저장</button>
  </div>
</header>

<main id="app" aria-live="polite">
  <p class="loading">불러오는 중…</p>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<script src="assets/admin/admin.js"></script>
</body>
</html>

<main id="main">
  <section class="p-hero ink ir-hero">
    <div class="wrap row">
      <div style="display:grid;gap:22px">
        <p class="eyebrow">IR · News</p>
        <h1>IR · 소식</h1>
        <p class="lead">IBR의 언론 보도와 보도자료, 공지, 투자자를 위한 자료를 모았습니다.</p>
      </div>
      <div class="facts" id="irFacts" hidden></div>
    </div>
    <span class="line" aria-hidden="true"></span>
  </section>

  <section class="ir paper">
    <div class="wrap">
      <div class="ir-list-view" id="irListView">
        <div class="ir-tabs" role="group" aria-label="분류" id="irTabs"></div>
        <div class="ir-list" id="irList"></div>
        <div class="ir-more"><button class="link-arrow" type="button" id="irMore" hidden>더 보기 {{ARROW}}</button></div>

          <p class="t">첫 소식을 준비하고 있습니다.</p>
          <p>언론 보도, 보도자료, IR 자료가 이곳에 차례로 올라옵니다.</p>
          <a class="link-arrow" href="index.html#contact">제휴·IR 문의 {{ARROW}}</a>
        </div>
      </div>
      <article class="ir-post" id="irPost" hidden></article>
    </div>
  </section>
</main>

<script>
/* 첫 방문(세션당 한 번)에만 인트로를 보여 줍니다. 주소 끝에 #intro 를 붙이면 다시 볼 수 있습니다. */
(function(){var d=document.documentElement,seen=false;
try{seen=sessionStorage.getItem("ibr-intro")==="1"}catch(e){}
if(location.hash==="#intro")seen=false;
if(!matchMedia("(prefers-reduced-motion: reduce)").matches&&!seen)d.classList.add("has-intro");})();
</script>

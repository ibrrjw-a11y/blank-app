[project]
name = "hotdeal-shorts"
version = "0.1.0"
description = "핫딜 쇼핑 쇼츠 제작·운영 자동화 CLI"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "pillow>=10",
    "numpy>=1.24",
    "requests>=2.31",
    "edge-tts>=6.1",
    "anthropic>=1.0",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
offline = ["sherpa-onnx>=1.10"]

[project.scripts]
hd = "hotdeal_shorts.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hotdeal_shorts*"]

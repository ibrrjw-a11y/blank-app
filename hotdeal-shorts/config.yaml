# 핫딜 쇼츠 설정. 값만 바꾸면 되고, 코드 수정은 필요 없음.

# ── 채널 3개: 서로 관련 없어 보이도록 이름 규칙·레이아웃·글꼴·색·목소리·올리는 시간을 전부 다르게 ──
default_channel: salim
channels:
  salim:                        # 생활·주방·식품
    name: "오늘도살림"
    handle: "@oneuldosalim"
    logo: "살"
    tagline: "살림 고수가 장바구니에 넣은 것만"
    layout: card                # 따뜻한 카드형
    colors: {color: "#F2A541", sub: "#FFE8C2", accent: "#D9480F", bg: "#FFF8EE", ink: "#2B2118"}
    fonts: {bold: "fonts/Pretendard-ExtraBold.otf", regular: "fonts/Pretendard-Medium.otf"}
    voice: {provider: edge, edge_voice: "ko-KR-SunHiNeural", rate: "+12%"}
    hashtags: ["#살림템", "#주방꿀템", "#생활용품", "#shorts"]
    upload_time: "19:30"
    toss_subtag: "yt-salim"     # 토스 링크를 채널별로 구분 (영문·숫자·-_. 만, 등록 후 변경 불가)
  tech:                         # 소형가전·디지털·차량
    name: "GEARLOG 기어로그"
    handle: "@gearlog.kr"
    tag: "GEARLOG"
    tagline: "살 가치 있는 전자기기만 기록합니다"
    layout: fullbleed           # 사진 꽉 찬 다크형
    colors: {color: "#111317", sub: "#2A2E36", accent: "#B6FF3B", bg: "#0E0F12", ink: "#FFFFFF"}
    fonts: {bold: "fonts/WantedSans-Black.otf", regular: "fonts/WantedSans-Medium.otf"}
    voice: {provider: edge, edge_voice: "ko-KR-InJoonNeural", rate: "+18%"}
    hashtags: ["#가전추천", "#전자기기", "#테크", "#shorts"]
    upload_time: "12:10"
    toss_subtag: "yt-gearlog"
  beauty:                       # 뷰티·헤어·바디
    name: "파우치노트"
    handle: "@pouch.note"
    tag: "POUCH NOTE"
    tagline: "화장대 위에 남는 것들의 기록"
    layout: magazine            # 여백 많은 잡지형
    colors: {color: "#E9D7CF", sub: "#F3E6E0", accent: "#B5485D", bg: "#F6F1EC", ink: "#231F1C"}
    fonts: {bold: "fonts/IBMPlexSansKR-Bold.otf", regular: "fonts/IBMPlexSansKR-Light.otf"}
    voice: {provider: supertonic, supertonic: {voice: "F3", speed: 1.1, steps: 10}}   # 무료 오프라인 음성 (다른 채널과 다른 목소리)
    hashtags: ["#뷰티템", "#화장품추천", "#스킨케어", "#shorts"]
    upload_time: "21:40"
    toss_subtag: "yt-pouchnote"

# 아래 channel 은 channels 가 비어 있을 때만 쓰는 기본값

channel:
  name: "오늘의 핫딜"          # 상단 배너 채널명 (내 브랜드로 교체)
  handle: "@my_hotdeal"
  color: "#FFE08A"              # 배너 배경색 (채널마다 다르게: 식품 노랑, 뷰티 핑크 등)
  ink: "#1C1C1E"                # 글자·아이콘 색
  label: "得"                   # 프로필 네모 안 글자 (한자 한 글자나 이모지 대신 짧은 글자)
  label_bg: "#FFF1C2"
  label_name: "핫딜"            # 딜에 카테고리가 없을 때 라벨 옆 이름
  tagline: "오늘 올라온 특가만 골라요"
  price_color: "#FF3B30"        # 할인율 색

video:
  width: 1080
  height: 1920
  fps: 30
  line_gap_sec: 0.12            # 줄과 줄 사이 숨 쉬는 간격 (줄 단위 합성일 때)
  tail_sec: 0.6                 # 마지막 줄 뒤 여운
  font: ""                      # 비워두면 자동 탐색 (Pretendard > Noto Sans CJK > 맑은고딕 > 애플고딕)
  price_reveal: true            # 가격표를 가격 말하는 줄부터 표시 (false 면 처음부터)

subtitle:
  max_chars: 15                 # 자막 한 줄 최대 글자 수
  max_lines: 2
  strip_period: true
  lead_sec: 0.15                # 자막을 목소리보다 먼저 띄우는 시간

voice:
  # 무료: edge(MS 음성, 인터넷) | supertonic(슈퍼톤 AI 음성, 오프라인) | sherpa·espeak(테스트용) | manual(파일 직접)
  # 유료(선택, 안 써도 됨): typecast | elevenlabs | openai | google
  provider: edge
  whole_script: true            # edge·typecast·elevenlabs: 대본 전체를 한 번에 읽혀 억양이 자연스럽게 이어짐
  edge_voice: "ko-KR-SunHiNeural"   # 남성: ko-KR-InJoonNeural
  rate: "+15%"                  # 쇼츠는 약간 빠르게
  supertonic:                   # 무료. pip install -e ".[free-voice]" 필요, 첫 실행 때 모델 자동 다운로드
    voice: "F1"                 # 여성 F1~F5, 남성 M1~M5  (hd voice sample 로 비교)
    speed: 1.15
    steps: 10                   # 5(빠름)~12(고품질)
  typecast:                     # hd voice list typecast 로 목소리 id 찾기
    voice_id: ""
    model: "ssfm-v30"
    tempo: 1.1                  # 0.5 ~ 2.0
    emotion: ""                 # 비우면 기본. 예: happy, sad, angry (목소리마다 지원 감정 다름)
  elevenlabs:                   # hd voice list elevenlabs
    voice_id: ""
    model: "eleven_multilingual_v2"
  openai:
    model: "gpt-4o-mini-tts"
    voice: "nova"               # alloy, echo, fable, onyx, nova, shimmer 등
    instructions: "밝고 빠른 한국어 쇼핑 쇼츠 나레이션. 친구에게 말하듯 반말로."
  google:
    voice: "ko-KR-Neural2-A"    # A·B 여성, C 남성 등
    rate: 1.1
  silence_db: -35               # 이 값보다 조용하면 무음으로 보고 잘라냄
  pad_sec: 0.03

images:
  provider: gemini              # gemini | openai | pollinations(무료) | none   (키가 없으면 자동으로 건너뜀)
  select: every                 # every(가격 줄 빼고 전부) | marked(줄 앞에 [img] 붙인 줄만) | first(장면마다 첫 줄)
  gemini_model: "gemini-2.5-flash-image"
  openai_model: "gpt-image-1"
  pollinations_model: "flux"    # 무료(키 없음) 이미지 — 작업 화면에서 "무료" 선택

script:
  provider: claude              # claude | template(키 없을 때 자동 대체)
  model: "claude-opus-5-5"
  effort: "medium"
  lines_min: 6
  lines_max: 12
  line_max_chars: 30            # 자막 2줄(15자 x 2) 안에 들어가게

capcut:
  drafts_dir: ""                # 비우면 자동 탐색 (Win: %LOCALAPPDATA%\CapCut\User Data\Projects\com.lveditor.draft)

deals:
  min_discount_pct: 30          # 이 할인율 미만은 후보에서 제외
  price_range_krw: [5000, 150000]
  min_reviews: 100              # 리뷰 수를 아는 경우에만 적용
  coupang_sub_id: "hotdealshorts"
  toss_use_thumbnails: false    # 토스 썸네일을 영상에 쓰는 건 토스 사전 확인 대상 → 확인받기 전엔 false

publish:
  disclosures:                  # 판매처별 제휴 고지 (비우면 제작 거부)
    coupang: "이 영상은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다."
    toss: "[광고] 토스쇼핑 쉐어링크 활동으로, 링크 구매 시 수수료를 지급받습니다."   # 설명란·고정댓글 첫 줄에 자동
    default: "이 영상에는 제휴 링크가 포함되어 있으며, 구매 시 일정액의 수수료를 받을 수 있습니다."
  price_notice: "가격은 {checked_at} 기준이며 판매처 사정에 따라 변동·품절될 수 있습니다."
  hashtags: ["#핫딜", "#쇼핑", "#꿀템", "#shorts"]

metrics:
  buy_intent_keywords: ["어디서", "링크", "사요", "구매", "얼마", "품절", "샀", "주문"]
  winner_multiplier: 3.0        # 채널 평균 대비 이 배수 이상이면 '터진 영상'
